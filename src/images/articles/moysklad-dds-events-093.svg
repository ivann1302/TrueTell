  <rect x="38" y="307" width="724" height="145" rx="22" fill="#fff" stroke="#a9c6d6" stroke-width="3"/>
  <text x="67" y="352" class="tag">ВНЕШНИЕ ДЕНЬГИ</text>
  <text x="67" y="403" class="p">Касса +2 000 ₽ · учётный счёт +7 840 ₽</text>
  <rect x="38" y="474" width="724" height="145" rx="22" fill="#fff" stroke="#a9c6d6" stroke-width="3"/>
  <text x="67" y="519" class="tag">КОМИССИЯ ЭКВАЙРИНГА</text>
  <text x="67" y="570" class="p">160 ₽ удержано из 8 000 ₽ оплаты</text>
  <rect x="38" y="641" width="724" height="145" rx="22" fill="#e8f3fa"/>
  <text x="67" y="686" class="tag">ПЕРЕВОД МЕЖДУ СВОИМИ СЧЕТАМИ</text>
