  <rect x="38" y="815" width="724" height="205" rx="22" fill="#dceef8"/>
  <text x="67" y="867" class="h">Учётный приток извне</text>
  <text x="67" y="925" class="n">+9 840 ₽</text>
  <text x="67" y="976" class="p">Перевод внутри компании: 0 ₽</text>
  <text x="38" y="1070" class="p">Даты документов и банка могут различаться.</text>
