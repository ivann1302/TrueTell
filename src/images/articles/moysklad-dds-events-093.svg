<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1110">
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#101621}.h{font-size:31px;font-weight:700}.p{font-size:27px}.n{font-size:36px;font-weight:700;fill:#087ebf}.tag{font-size:22px;font-weight:700;fill:#386278}</style></defs>
  <text x="38" y="55" class="h">Одна продажа — разные события</text>
