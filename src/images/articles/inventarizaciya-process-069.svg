<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <rect width="1600" height="1000" rx="28" fill="#F6F7F9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101621">
    <text x="88" y="100" font-size="25" font-weight="700" letter-spacing="1.4" fill="#616875">ПРАКТИЧЕСКАЯ СХЕМА</text>
    <text x="88" y="170" font-size="48" font-weight="700">Инвентаризация: от подготовки до исправления</text>
    <text x="88" y="222" font-size="25" fill="#616875">Каждый этап оставляет понятный результат для следующего</text>
  </g>
  <g>
    <rect x="88" y="292" width="440" height="220" rx="20" fill="#FFFFFF" stroke="#DCE1E8" stroke-width="2"/>
    <rect x="580" y="292" width="440" height="220" rx="20" fill="#FFFFFF" stroke="#DCE1E8" stroke-width="2"/>
    <rect x="1072" y="292" width="440" height="220" rx="20" fill="#FFFFFF" stroke="#DCE1E8" stroke-width="2"/>
    <rect x="330" y="604" width="440" height="220" rx="20" fill="#FFFFFF" stroke="#DCE1E8" stroke-width="2"/>
    <rect x="822" y="604" width="440" height="220" rx="20" fill="#FFFFFF" stroke="#DCE1E8" stroke-width="2"/>
  </g>
  <g fill="#1765DA">
    <circle cx="132" cy="338" r="25"/><circle cx="624" cy="338" r="25"/><circle cx="1116" cy="338" r="25"/><circle cx="374" cy="650" r="25"/><circle cx="866" cy="650" r="25"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-size="24" font-weight="700" text-anchor="middle">
    <text x="132" y="346">1</text><text x="624" y="346">2</text><text x="1116" y="346">3</text><text x="374" y="658">4</text><text x="866" y="658">5</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101621">
    <text x="174" y="347" font-size="27" font-weight="700">Определите охват</text>
    <text x="124" y="403" font-size="23" fill="#616875">Склад, зона, группа товаров;</text><text x="124" y="438" font-size="23" fill="#616875">назначьте ответственных.</text>
    <text x="666" y="347" font-size="27" font-weight="700">Ограничьте движение</text>
    <text x="616" y="403" font-size="23" fill="#616875">На время пересчёта остановите</text><text x="616" y="438" font-size="23" fill="#616875">продажи и приёмку товаров.</text>
    <text x="1158" y="347" font-size="27" font-weight="700">Зафиксируйте факт</text>
    <text x="1108" y="403" font-size="23" fill="#616875">Пересчитайте и внесите данные</text><text x="1108" y="438" font-size="23" fill="#616875">тем способом, который доступен.</text>
    <text x="416" y="659" font-size="27" font-weight="700">Разберите расхождения</text>
    <text x="366" y="715" font-size="23" fill="#616875">Сверьте количества и учтите</text><text x="366" y="750" font-size="23" fill="#616875">движение товара во время работ.</text>
    <text x="908" y="659" font-size="27" font-weight="700">Оформите результат</text>
    <text x="858" y="715" font-size="23" fill="#616875">Недостача → списание;</text><text x="858" y="750" font-size="23" fill="#616875">излишек → оприходование.</text>
  </g>
  <g stroke="#1765DA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M528 402h36m-12-12 12 12-12 12"/><path d="M1020 402h36m-12-12 12 12-12 12"/>
    <path d="M1310 512v44h-686v44m0 0 12-12m-12 12 12 12"/>
    <path d="M770 714h36m-12-12 12 12-12 12"/>
  </g>
  <path d="M88 884h1424" stroke="#DCE1E8" stroke-width="2"/>
  <text x="88" y="932" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#616875">Сохранение инвентаризации фиксирует результат пересчёта, но само не меняет складской остаток.</text>
</svg>
