<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810">
<g font-family="Arial,Helvetica,sans-serif" fill="#10131A">
<text x="48" y="54" font-size="30" fill="#616875">crm.item.fields — примеры форматов из справки</text>
<path d="M48 85H952" stroke="#D3D7DE" stroke-width="2"/>
<text x="48" y="145" font-size="38" fill="#616875">useOriginalUfNames = N · по умолчанию</text>
<text x="48" y="215" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="48">ufCrm2_1639669411830</text>
<text x="48" y="265" font-size="36" fill="#616875">Имя пользовательского поля в camelCase</text>
<path d="M48 310H952" stroke="#D3D7DE" stroke-width="2"/>
<text x="48" y="370" font-size="38" fill="#1765DA">useOriginalUfNames = Y</text>
<text x="48" y="440" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="48">UF_CRM_2_1639669411830</text>
<text x="48" y="490" font-size="36" fill="#616875">Исходное имя пользовательского поля</text>
<path d="M48 535H952" stroke="#D3D7DE" stroke-width="2"/>
<text x="48" y="595" font-size="38" fill="#616875">Системное поле в описании API</text>
<text x="48" y="660" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="48">title</text><text x="285" y="660" font-size="36" fill="#616875">upperName:</text><text x="530" y="660" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="48">TITLE</text>
<text x="48" y="724" font-size="36">Параметр Y не превращает title в TITLE.</text>
<text x="48" y="776" font-size="28" fill="#616875">Это примеры документации. Проверьте код своего поля.</text>
</g></svg>