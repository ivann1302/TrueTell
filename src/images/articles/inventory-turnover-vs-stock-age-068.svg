<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <g font-family="Arial, Helvetica, sans-serif" fill="#101621">
    <text x="96" y="108" font-size="26" font-weight="700" letter-spacing="1.4" fill="#616875">ДВА РАЗНЫХ ВОПРОСА О ЗАПАСАХ</text>
    <text x="96" y="190" font-size="48" font-weight="700">Оборачиваемость ≠ возраст остатка</text>
    <path d="M800 260V700" stroke="#D3D7DE" stroke-width="2"/>
    <text x="96" y="300" font-size="28" font-weight="700" fill="#1765DA">ОБОРАЧИВАЕМОСТЬ ЗА ПЕРИОД</text>
    <text x="96" y="366" font-size="25" fill="#616875">Себестоимость продаж / средний запас</text>
    <text x="96" y="422" font-size="25" fill="#616875">90 дней / 3 оборота</text>
    <text x="96" y="510" font-size="62" font-weight="700">30 дней</text>
    <text x="96" y="572" font-size="24" fill="#616875">Расчётное покрытие среднего запаса</text>
    <text x="96" y="612" font-size="24" fill="#616875">себестоимостью продаж за выбранный период.</text>
    <text x="864" y="300" font-size="28" font-weight="700" fill="#1765DA">«ДНЕЙ НА СКЛАДЕ» В МОЁМСКЛАДЕ</text>
    <text x="864" y="366" font-size="25" fill="#616875">Возраст текущих остатков по партиям</text>
    <text x="864" y="422" font-size="25" fill="#616875">(18 × 6 + 9 × 9) / 15</text>
    <text x="864" y="510" font-size="62" font-weight="700">12,6 дня</text>
    <text x="864" y="572" font-size="24" fill="#616875">Пример из справки: часть яблок поступила</text>
    <text x="864" y="612" font-size="24" fill="#616875">раньше, часть — позже; учитывается остаток партии.</text>
    <path d="M96 700H1504" stroke="#D3D7DE" stroke-width="2"/>
    <text x="96" y="760" font-size="26" font-weight="700" fill="#616875">Показатели используют разные данные и отвечают на разные вопросы.</text>
    <text x="96" y="808" font-size="24" fill="#616875">Не сравнивайте их как один и тот же норматив или результат.</text>
  </g>
  <g stroke="#1765DA" stroke-width="5" stroke-linecap="round">
    <path d="M100 662H700"/><path d="M864 662H1504"/>
  </g>
  <g fill="#1765DA">
    <circle cx="100" cy="662" r="8"/><circle cx="700" cy="662" r="8"/>
    <circle cx="864" cy="662" r="8"/><circle cx="1504" cy="662" r="8"/>
  </g>
</svg>
