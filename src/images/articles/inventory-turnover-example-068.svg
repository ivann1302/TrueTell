    <text x="96" y="190" font-size="48" font-weight="700">Один период — сопоставимые данные для расчёта</text>
    <text x="96" y="246" font-size="28" fill="#616875">I квартал 2026 · себестоимость и остаток в одной валюте</text>
    <text x="96" y="330" font-size="25" font-weight="700" fill="#616875">ОСТАТОК ПО СЕБЕСТОИМОСТИ НА КОНЕЦ МЕСЯЦА</text>
    <text x="96" y="408" font-size="25">Январь</text>
    <text x="96" y="490" font-size="25">Февраль</text>
    <text x="96" y="572" font-size="25">Март</text>
    <text x="270" y="408" font-size="25" font-weight="700">280 тыс. ₽</text>
    <text x="270" y="490" font-size="25" font-weight="700">300 тыс. ₽</text>
    <text x="270" y="572" font-size="25" font-weight="700">320 тыс. ₽</text>
    <text x="780" y="345" font-size="25" font-weight="700" fill="#616875">СРЕДНИЙ ЗАПАС</text>
    <text x="780" y="420" font-size="38" font-weight="700">(280 + 300 + 320) / 3</text>
    <text x="780" y="475" font-size="34" font-weight="700" fill="#1765DA">= 300 тыс. ₽</text>
    <text x="780" y="550" font-size="25" font-weight="700" fill="#616875">СЕБЕСТОИМОСТЬ ПРОДАЖ ЗА 90 ДНЕЙ</text>
    <text x="780" y="602" font-size="34" font-weight="700">900 тыс. ₽</text>
    <path d="M780 648H1410" stroke="#D3D7DE" stroke-width="2"/>
    <text x="780" y="712" font-size="26" font-weight="700" fill="#616875">900 / 300 =</text>
    <text x="1010" y="720" font-size="60" font-weight="700" fill="#1765DA">3 оборота</text>
    <text x="780" y="790" font-size="26" font-weight="700" fill="#616875">90 дней / 3 =</text>
    <text x="1010" y="798" font-size="60" font-weight="700" fill="#1765DA">30 дней</text>
  </g>
  <g stroke="#1765DA" stroke-width="18" stroke-linecap="round">
    <path d="M500 398H700"/>
    <path d="M500 480H714"/>
    <path d="M500 562H728"/>
