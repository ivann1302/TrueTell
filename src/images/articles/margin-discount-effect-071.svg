<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .title{font:700 46px Arial,sans-serif;fill:#202a39}.sub{font:400 24px Arial,sans-serif;fill:#687384}.label{font:700 24px Arial,sans-serif;fill:#202a39}.body{font:400 22px Arial,sans-serif;fill:#465365}.small{font:400 18px Arial,sans-serif;fill:#687384}.number{font:700 40px Arial,sans-serif;fill:#101621}.blue{fill:#246bdb}.pale{fill:#bdd3fa}.orange{fill:#e5a250}.red{fill:#b84747}.line{stroke:#d9e0e8;stroke-width:2}
    </style>
  </defs>
  <text x="80" y="92" class="title">Скидка 10% уменьшает валовую прибыль на 30%</text>
  <text x="80" y="138" class="sub">Условный товар · себестоимость без НДС — 1 000 ₽ · других затрат в примере нет</text>

  <rect x="80" y="190" width="600" height="490" rx="24" fill="#fff" stroke="#d9e0e8" stroke-width="2"/>
  <rect x="760" y="190" width="600" height="490" rx="24" fill="#fff" stroke="#d9e0e8" stroke-width="2"/>
  <text x="120" y="250" class="label">До скидки</text>
  <text x="800" y="250" class="label">После скидки 10%</text>
  <text x="120" y="315" class="small">Выручка</text>
  <text x="800" y="315" class="small">Выручка</text>
  <text x="120" y="365" class="number">1 500 ₽</text>
  <text x="800" y="365" class="number">1 350 ₽</text>
  <line x1="120" y1="395" x2="640" y2="395" class="line"/>
  <line x1="800" y1="395" x2="1320" y2="395" class="line"/>
  <text x="120" y="445" class="body">Себестоимость</text>
  <text x="800" y="445" class="body">Себестоимость</text>
  <text x="120" y="485" class="label">1 000 ₽</text>
  <text x="800" y="485" class="label">1 000 ₽</text>
  <text x="120" y="545" class="body">Валовая прибыль</text>
  <text x="800" y="545" class="body">Валовая прибыль</text>
  <text x="120" y="595" class="number">500 ₽</text>
  <text x="800" y="595" class="number">350 ₽</text>
  <rect x="120" y="620" width="490" height="18" rx="9" class="pale"/>
  <rect x="120" y="620" width="163" height="18" rx="9" class="blue"/>
  <rect x="800" y="620" width="490" height="18" rx="9" class="pale"/>
  <rect x="800" y="620" width="127" height="18" rx="9" class="orange"/>

  <rect x="80" y="720" width="1280" height="92" rx="20" fill="#f2f5fa"/>
  <text x="120" y="778" class="label">Маржинальность</text>
  <text x="450" y="778" class="number">33,3%</text>
  <path d="M690 767h80" stroke="#687384" stroke-width="3"/>
  <path d="m760 757 14 10-14 10" fill="none" stroke="#687384" stroke-width="3"/>
  <text x="830" y="778" class="number">25,9%</text>
  <text x="1080" y="778" class="small">−7,4 п. п.</text>
  <text x="80" y="866" class="small">Маржинальность = валовая прибыль ÷ фактическая выручка. Учебный пример, не данные магазина.</text>
</svg>
