<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Параметры робота Поставить задачу</title>
  <desc id="desc">Учебная карта настройки робота сделки: стадия КП готово, задача Проверить КП, исполнитель руководитель отдела, срок через один день, запуск в текущее время.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="48" font-size="27" font-weight="700" fill="#101621">Один робот на одной стадии</text>
    <text x="24" y="82" font-size="18" fill="#616875">Учебный пример · «Поставить задачу»</text>
    <rect x="24" y="113" width="872" height="474" rx="16" fill="#fff" stroke="#d3d7de" stroke-width="2"/>
    <rect x="24" y="113" width="872" height="70" rx="16" fill="#eef5ff"/>
    <path d="M24 166 H896" stroke="#d3d7de" stroke-width="2"/>
    <text x="51" y="155" font-size="19" font-weight="700" fill="#1765da">ПАРАМЕТР</text>
    <text x="324" y="155" font-size="19" font-weight="700" fill="#1765da">ЗНАЧЕНИЕ В ПРИМЕРЕ</text>
    <path d="M295 183 V587 M24 264 H896 M24 345 H896 M24 426 H896 M24 507 H896" stroke="#e3e6eb" stroke-width="2"/>
    <text x="51" y="229" font-size="21" font-weight="700" fill="#101621">Стадия</text>
    <text x="324" y="229" font-size="21" fill="#263447">«КП готово» в воронке продаж</text>
    <text x="51" y="310" font-size="21" font-weight="700" fill="#101621">Название</text>
    <text x="324" y="310" font-size="21" fill="#263447">«Проверить КП» + название сделки</text>
    <text x="51" y="391" font-size="21" font-weight="700" fill="#101621">Исполнитель</text>
    <text x="324" y="391" font-size="21" fill="#263447">Руководитель отдела продаж</text>
    <text x="51" y="472" font-size="21" font-weight="700" fill="#101621">Крайний срок</text>
    <text x="324" y="472" font-size="21" fill="#263447">Через один день после создания</text>
    <text x="51" y="553" font-size="21" font-weight="700" fill="#101621">Когда</text>
    <text x="324" y="553" font-size="21" fill="#263447">«Текущее время» · без условия</text>
  </g>
</svg>
