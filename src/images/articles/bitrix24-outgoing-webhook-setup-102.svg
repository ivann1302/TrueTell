<svg xmlns="http://www.w3.org/2000/svg" width="700" height="790" viewBox="0 0 700 790" role="img" aria-labelledby="title desc">
<title id="title">Настройка исходящего вебхука Битрикс24</title>
<desc id="desc">Четыре условия: публичный HTTPS адрес, событие, токен приложения и тестовое изменение сделки.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="48" font-size="30" font-weight="700" fill="#101621">До первого события</text>
<text x="24" y="84" font-size="22" fill="#606a79">Редакционная карта · не экран CRM</text>
<rect x="24" y="112" width="652" height="620" rx="18" fill="#fff" stroke="#d8dfe9" stroke-width="2"/>
<rect x="48" y="140" width="56" height="56" rx="14" fill="#e7f0ff"/><text x="67" y="178" font-size="27" font-weight="700" fill="#1765da">1</text>
<text x="126" y="163" font-size="25" font-weight="700" fill="#101621">Адрес обработчика</text>
<text x="126" y="194" font-size="21" fill="#34445a">Публичный HTTPS URL</text>
<text x="126" y="221" font-size="21" fill="#34445a">принимает POST.</text>
<path d="M48 247H652" stroke="#e3e8ef" stroke-width="2"/>
<rect x="48" y="275" width="56" height="56" rx="14" fill="#e7f0ff"/><text x="67" y="313" font-size="27" font-weight="700" fill="#1765da">2</text>
<text x="126" y="298" font-size="25" font-weight="700" fill="#101621">Событие</text>
<text x="126" y="329" font-size="21" fill="#34445a">Например, ONCRMDEALUPDATE —</text>
<text x="126" y="356" font-size="21" fill="#34445a">изменение сделки.</text>
<path d="M48 382H652" stroke="#e3e8ef" stroke-width="2"/>
<rect x="48" y="410" width="56" height="56" rx="14" fill="#e7f0ff"/><text x="67" y="448" font-size="27" font-weight="700" fill="#1765da">3</text>
<text x="126" y="433" font-size="25" font-weight="700" fill="#101621">Токен приложения</text>
<text x="126" y="464" font-size="21" fill="#34445a">Сохраните после создания</text>
<text x="126" y="491" font-size="21" fill="#34445a">как секрет на сервере.</text>
<path d="M48 517H652" stroke="#e3e8ef" stroke-width="2"/>
<rect x="48" y="545" width="56" height="56" rx="14" fill="#e7f0ff"/><text x="67" y="583" font-size="27" font-weight="700" fill="#1765da">4</text>
<text x="126" y="568" font-size="25" font-weight="700" fill="#101621">Контрольная сделка</text>
<text x="126" y="599" font-size="21" fill="#34445a">Измените тестовую карточку</text>
<text x="126" y="626" font-size="21" fill="#34445a">и проверьте приём.</text>
<rect x="48" y="662" width="604" height="45" rx="9" fill="#f2f6fc"/>
<text x="62" y="690" font-size="19" fill="#34445a">Разработчикам → Готовые сценарии → Другое</text>
<text x="24" y="769" font-size="22" font-weight="700" fill="#1765da">→ Исходящий вебхук</text>
</g></svg>
