<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620">
  <title>Остатки по трём учебным сделкам на 12 октября 2026 года</title>
  <desc>48 тысяч рублей по D-1042 имеют будущий срок. По D-1181 40 тысяч просрочено и 20 тысяч имеют будущий срок. D-1210 оплачен. Итого 108 тысяч: 40 просрочено и 68 с будущими сроками.</desc>
  <g font-family="Arial, sans-serif" fill="#10131A" font-size="32">
    <text x="24" y="48">D-1042</text><text x="696" y="48" text-anchor="end">48 000 ₽</text>
    <rect x="24" y="72" width="432" height="36" rx="4" fill="#1765DA"/>
    <text x="24" y="151" font-size="28" fill="#616875">20 октября · срок впереди</text>
    <path d="M24 182H696" stroke="#D3D7DE" stroke-width="1"/>
    <text x="24" y="232">D-1181</text><text x="696" y="232" text-anchor="end">60 000 ₽</text>
    <rect x="24" y="256" width="360" height="36" rx="4" fill="#C74242"/>
    <rect x="384" y="256" width="180" height="36" rx="4" fill="#1765DA"/>
    <text x="24" y="333" font-size="28" fill="#616875">40 000 ₽ · 5 октября</text>
    <text x="24" y="375" font-size="28" fill="#616875">20 000 ₽ · 25 октября</text>
    <path d="M24 405H696" stroke="#D3D7DE" stroke-width="1"/>
    <text x="24" y="451">D-1210</text><text x="696" y="451" text-anchor="end">0 ₽</text>
    <text x="24" y="493" font-size="28" fill="#616875">Непогашенных платежей нет</text>
    <rect x="24" y="532" width="22" height="22" rx="3" fill="#C74242"/>
    <text x="60" y="554" font-size="30">40 000 ₽ просрочено</text>
    <rect x="24" y="578" width="22" height="22" rx="3" fill="#1765DA"/>
    <text x="60" y="600" font-size="30">68 000 ₽ со сроком впереди</text>
  </g>
</svg>
