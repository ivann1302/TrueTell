<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <style>
      .title{font:700 46px Arial,sans-serif;fill:#202a39}.sub{font:400 24px Arial,sans-serif;fill:#687384}.label{font:700 24px Arial,sans-serif;fill:#202a39}.body{font:400 22px Arial,sans-serif;fill:#465365}.big{font:700 42px Arial,sans-serif;fill:#101621}.small{font:400 18px Arial,sans-serif;fill:#687384}.formula{font:700 24px Arial,sans-serif;fill:#202a39}.blue{fill:#246bdb}.light{fill:#bdd3fa}.line{stroke:#d9e0e8;stroke-width:2}
    </style>
  </defs>
  <text x="80" y="92" class="title">Одна продажа — два разных процента</text>
  <text x="80" y="138" class="sub">Цена без НДС 1 500 ₽ · себестоимость 1 000 ₽ · валовая прибыль 500 ₽</text>
  <rect x="80" y="190" width="1280" height="168" rx="24" fill="#f2f5fa"/>
  <text x="120" y="236" class="label">Состав выручки</text>
  <rect x="120" y="264" width="1100" height="48" rx="12" fill="#bdd3fa"/>
  <path d="M132 264h720v48H132a12 12 0 0 1-12-12v-24a12 12 0 0 1 12-12Z" class="blue"/>
  <text x="150" y="297" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Себестоимость 1 000 ₽</text>
  <text x="875" y="297" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2a38">Валовая прибыль 500 ₽</text>
  <text x="1240" y="297" class="small">1 500 ₽</text>

  <rect x="80" y="398" width="620" height="360" rx="24" fill="#fff" stroke="#d9e0e8" stroke-width="2"/>
  <rect x="740" y="398" width="620" height="360" rx="24" fill="#fff" stroke="#d9e0e8" stroke-width="2"/>
  <text x="120" y="456" class="label">Маржинальность</text>
  <text x="780" y="456" class="label">Наценка</text>
  <text x="120" y="520" class="body">Валовая прибыль ÷ выручка</text>
  <text x="780" y="520" class="body">Валовая прибыль ÷ себестоимость</text>
  <line x1="120" y1="550" x2="660" y2="550" class="line"/>
  <line x1="780" y1="550" x2="1320" y2="550" class="line"/>
  <text x="120" y="625" class="formula">500 ÷ 1 500 × 100%</text>
  <text x="780" y="625" class="formula">500 ÷ 1 000 × 100%</text>
  <text x="120" y="700" class="big">33,3%</text>
  <text x="780" y="700" class="big">50%</text>
  <text x="120" y="735" class="small">Доля валовой прибыли в выручке</text>
  <text x="780" y="735" class="small">Превышение цены над себестоимостью</text>

  <text x="80" y="830" class="body">Разница — в знаменателе, а не в сумме прибыли.</text>
  <text x="80" y="870" class="small">Учебная редакционная инфографика. Не данные магазина и не финансовая рекомендация.</text>
</svg>
